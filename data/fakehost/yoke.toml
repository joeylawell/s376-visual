# s376-fakehost USB yoke / throttle / pedals mapping
# Raw axes are -1..1 from winmm, XInput, evdev or SDL2.
# See docs/FAKEHOST_API.md for Windows --joystick flag names.

[axis.aileron]
source = "x"
invert = false
deadzone = 0.04
min = -1.0
max = 1.0
center = 0.0

[axis.elevator]
source = "y"
invert = true
deadzone = 0.04
min = -1.0
max = 1.0
center = 0.0

[axis.rudder]
source = "rx"
invert = false
deadzone = 0.06
min = -1.0
max = 1.0
center = 0.0

[axis.throttle]
source = "z"
invert = true
deadzone = 0.02
min = -1.0
max = 1.0
center = 0.0

[button]
gear = 0
flaps = 1
lights = 2
